{% extends 'base.html' %}
{% block titulo %}Solicitar diseño{% endblock %}
{% block contenido %}
<div class="tarjeta formulario">
    <h1>🎨 Solicitar diseño personalizado</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar solicitud</button>
        <a href="{% url 'personalizacion:mis_disenos' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
