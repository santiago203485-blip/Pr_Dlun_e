{% extends 'base.html' %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="tarjeta formulario">
    <h1>Cambiar contraseña</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Actualizar</button>
        <a href="{% url 'usuarios:perfil' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
