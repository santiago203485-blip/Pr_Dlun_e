{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta formulario" style="margin:0 auto">
    <h1>Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        <p><label for="id_username">Usuario</label>{{ form.username }}</p>
        <p><label for="id_password">Contraseña</label>{{ form.password }}</p>
        <button type="submit">Ingresar</button>
    </form>
    <p style="margin-top:15px">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
</div>
{% endblock %}
