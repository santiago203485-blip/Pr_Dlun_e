{% extends 'base.html' %}
{% block titulo %}Categoría{% endblock %}
{% block contenido %}
<div class="tarjeta formulario">
    <h1>{% if categoria %}Editar categoría{% else %}Nueva categoría{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'catalogo:categorias' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
